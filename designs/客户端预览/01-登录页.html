<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录页 — 旭峰新材料 综合管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .page {
    width: 1400px;
    display: flex; flex-direction: column; align-items: center;
  }
  .page-header {
    margin-bottom: 16px;
    color: #666;
    font-size: 14px;
  }
  .page-header span {
    background: #d0d0d0;
    padding: 3px 12px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 13px;
    color: #444;
  }
  .card {
    width: 420px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 44px;
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: #333;
    margin-bottom: 32px;
    text-align: center;
    letter-spacing: 1px;
  }
  .label {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    align-self: flex-start;
  }
  .input {
    width: 100%;
    height: 42px;
    border: 2px solid #ddd;
    border-radius: 4px;
    margin-bottom: 20px;
    background: #fafafa;
  }
  .btn {
    width: 100%;
    height: 44px;
    border: 2px solid #aaa;
    border-radius: 4px;
    background: #e0e0e0;
    font-size: 15px;
    color: #555;
    cursor: default;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .copyright {
    margin-top: 20px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    路由: <span>/login</span> — 登录页
  </div>
  <div class="card">
    <div class="card-title">旭峰新材料 综合管理系统</div>
    <div class="label">用户名</div>
    <div class="input"></div>
    <div class="label">密码</div>
    <div class="input"></div>
    <div class="btn">登 录</div>
  </div>
  <div class="copyright">&copy; 2025 旭峰新材料 · 综合管理系统 v1.0</div>
</div>
</body>
</html>
