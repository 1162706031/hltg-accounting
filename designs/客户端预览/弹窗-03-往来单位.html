<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>往来单位 — 新建/编辑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:480px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.field{margin-bottom:16px}
.label{font-size:13px;color:#666;margin-bottom:6px}
.input{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%}
.checkbox-group{display:flex;gap:16px;align-items:center;height:40px}
.checkbox-group label{font-size:13px;color:#555;display:flex;align-items:center;gap:4px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-primary{background:#e0e0e0;border:2px solid #bbb;color:#333}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">往来单位 — 新建/编辑</div>
  <div class="field"><div class="label">单位名称</div><div class="input">富烽金属材料有限公司</div></div>
  <div class="field"><div class="label">简称</div><div class="input">富烽</div></div>
  <div class="field">
    <div class="label">角色</div>
    <div class="checkbox-group">
      <label><input type="checkbox" checked> 客户</label>
      <label><input type="checkbox" checked> 供应商</label>
      <label><input type="checkbox"> 外协厂</label>
    </div>
  </div>
  <div class="field"><div class="label">联系人</div><div class="input"></div></div>
  <div class="field"><div class="label">电话</div><div class="input"></div></div>
  <div class="field"><div class="label">地址</div><div class="input"></div></div>
  <div class="field"><div class="label">备注</div><div class="input"></div></div>
  <div class="actions">
    <div class="btn btn-primary">保存</div>
    <div class="btn btn-cancel">取消</div>
  </div>
</div>
</body>
</html>
