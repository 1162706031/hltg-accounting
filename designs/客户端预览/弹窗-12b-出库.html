<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>出库 — H13 / 630</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:520px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.row{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.field{flex:1}
.label{font-size:13px;color:#666;margin-bottom:6px}
.input{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%}
.select{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%;justify-content:space-between}
.info-box{background:#f8f8f8;border:1px solid #ddd;border-radius:4px;padding:12px 14px;font-size:13px;color:#666;margin-bottom:16px;line-height:1.8}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-primary{background:#e0e0e0;border:2px solid #bbb;color:#333}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">出库 — H13 / 630</div>
  <div class="info-box">
    <strong>当前库存信息</strong><br>
    物品: H13 / 630 | 归属: 本厂 | 当前: 3支 / 3.632吨
  </div>
  <div class="row"><div class="field"><div class="label">出库日期</div><div class="input">2025-06-09</div></div></div>
  <div class="row">
    <div class="field"><div class="label">出库支数 (≤3)</div><div class="input"></div></div>
    <div class="field"><div class="label">出库重量 (≤3.632)</div><div class="input"></div></div>
  </div>
  <div class="row"><div class="field"><div class="label">去向</div><div class="input" style="color:#bbb;">发货/加工/损耗...</div></div></div>
  <div class="row"><div class="field"><div class="label">关联订单 (可选)</div><div class="select">— <span style="color:#aaa;">▾</span></div></div></div>
  <div class="row"><div class="field"><div class="label">备注</div><div class="input"></div></div></div>
  <div class="actions">
    <div class="btn btn-primary">确认出库</div>
    <div class="btn btn-cancel">取消</div>
  </div>
</div>
</body>
</html>
