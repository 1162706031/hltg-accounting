<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户 — 新建/编辑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:480px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.field{margin-bottom:16px}
.label{font-size:13px;color:#666;margin-bottom:6px}
.input{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%}
.select{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%;justify-content:space-between}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-primary{background:#e0e0e0;border:2px solid #bbb;color:#333}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">用户 — 新建/编辑</div>
  <div class="field"><div class="label">用户名</div><div class="input">zhangsan</div></div>
  <div class="field"><div class="label">密码</div><div class="input" style="color:#bbb;">••••••</div></div>
  <div class="field"><div class="label">姓名</div><div class="input">张三</div></div>
  <div class="field"><div class="label">角色</div><div class="select">会计 <span style="color:#aaa;">▾</span></div></div>
  <div class="field"><div class="label">状态</div><div class="select">启用 <span style="color:#aaa;">▾</span></div></div>
  <div class="actions">
    <div class="btn btn-primary">保存</div>
    <div class="btn btn-cancel">取消</div>
  </div>
</div>
</body>
</html>
