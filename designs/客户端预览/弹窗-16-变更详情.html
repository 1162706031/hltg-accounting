<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>变更详情</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:580px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.info-box{background:#f8f8f8;border:1px solid #ddd;border-radius:4px;padding:14px 16px;font-size:13px;color:#666;margin-bottom:16px;line-height:2}
.changes-box{background:#f8f8f8;border:1px solid #ddd;border-radius:4px;padding:16px;font-size:13px;margin-bottom:16px}
.changes-box .title{font-weight:600;color:#555;margin-bottom:10px}
.change-line{font-family:monospace;font-size:13px;padding:3px 0}
.change-add{color:#2d8a2d}
.change-del{color:#cc3333;text-decoration:line-through}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">变更详情</div>

  <div class="info-box">
    操作人: 张三 | 时间: 2025-06-09 14:35:22<br>
    IP: 192.168.1.100
  </div>

  <div class="changes-box">
    <div class="title">变更内容:</div>
    <div class="change-line change-add">+ 物品: H13母棒 / 630</div>
    <div class="change-line change-add">+ 炉号: 3-60-63</div>
    <div class="change-line change-add">+ 重量: 7.311 吨</div>
    <div class="change-line change-add">+ 支数: 16</div>
    <div class="change-line change-del">- 旧重量: 6.500 吨</div>
  </div>

  <div class="actions">
    <div class="btn btn-cancel">关闭</div>
  </div>
</div>
</body>
</html>
