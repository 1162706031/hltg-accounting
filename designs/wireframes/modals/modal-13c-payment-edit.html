<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>收付款记录 — 新建/编辑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:520px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.field{margin-bottom:16px}
.label{font-size:13px;color:#666;margin-bottom:6px}
.input{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%}
.select{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%;justify-content:space-between}
.radio-group{display:flex;gap:20px;align-items:center;height:40px}
.radio-group label{font-size:13px;color:#555;display:flex;align-items:center;gap:6px}
.radio{width:16px;height:16px;border:2px solid #aaa;border-radius:50%;display:inline-block}
.radio-on{background:#4a90d9;border-color:#4a90d9}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-primary{background:#e0e0e0;border:2px solid #bbb;color:#333}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">收付款记录 — 新建/编辑</div>
  <div class="field"><div class="label">往来单位</div><div class="select">富烽 <span style="color:#aaa;">▾</span></div></div>
  <div class="field">
    <div class="label">方向</div>
    <div class="radio-group">
      <label><span class="radio radio-on"></span> 收款</label>
      <label><span class="radio"></span> 付款</label>
    </div>
  </div>
  <div class="field"><div class="label">日期</div><div class="input">2025-05-20</div></div>
  <div class="field"><div class="label">金额</div><div class="input">500,000</div></div>
  <div class="field"><div class="label">方式</div><div class="select">电汇 <span style="color:#aaa;">▾</span></div></div>
  <div class="field"><div class="label">关联订单 (多选)</div><div class="select">3000001, 3000002 <span style="color:#aaa;">▾</span></div></div>
  <div class="field"><div class="label">备注</div><div class="input">3月加工费</div></div>
  <div class="actions">
    <div class="btn btn-primary">保存</div>
    <div class="btn btn-cancel">取消</div>
  </div>
</div>
</body>
</html>
