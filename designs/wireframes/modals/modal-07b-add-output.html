<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>添加出钢 (冶炼)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;display:flex;justify-content:center;align-items:flex-start;padding:48px}
.modal{min-width:720px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:32px 36px}
.modal-title{font-size:18px;font-weight:600;color:#333;border-bottom:1px solid #eee;padding-bottom:16px;margin-bottom:24px}
.row{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.field{flex:1}
.label{font-size:13px;color:#666;margin-bottom:6px}
.input{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;width:100%}
.select{height:40px;border:2px solid #ddd;background:#fafafa;border-radius:4px;padding:0 12px;font-size:13px;color:#555;display:flex;align-items:center;justify-content:space-between}
.section{border:1px solid #eee;border-radius:4px;padding:16px;margin-bottom:16px}
.section-title{font-size:13px;color:#888;font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th{background:#f5f5f5;color:#666;font-weight:600;padding:10px 14px;border:1px solid #eee;text-align:left}
td{padding:10px 14px;border:1px solid #eee;color:#777}
.inp-cell{border:1px solid #ccc;padding:4px 8px;background:#fff;border-radius:3px;min-width:60px;display:inline-block;font-size:12px;color:#555}
.sel-cell{border:1px solid #ccc;padding:4px 8px;background:#fafafa;border-radius:3px;font-size:12px;color:#555;display:inline-flex;align-items:center;gap:4px}
.hint{font-size:12px;color:#999;margin-top:12px}
.total{font-size:13px;color:#555;font-weight:600;padding:8px 0}
.btn-inline{padding:4px 12px;border:2px solid #bbb;border-radius:4px;background:#e0e0e0;font-size:12px;color:#555;cursor:default;display:inline-block}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{padding:10px 22px;border-radius:4px;font-size:13px;cursor:default}
.btn-primary{background:#e0e0e0;border:2px solid #bbb;color:#333}
.btn-cancel{background:#fff;border:2px solid #ccc;color:#666}
</style>
</head>
<body>
<div class="modal">
  <div class="modal-title">添加出钢 (冶炼)</div>

  <div class="section">
    <div class="section-title">从物品目录选</div>
    <table>
      <thead><tr><th>☐</th><th>物品</th><th>规格</th><th>默认单位</th></tr></thead>
      <tbody>
        <tr><td>☐</td><td>1.2888母棒</td><td>300*12</td><td>吨</td></tr>
        <tr><td>☑</td><td>H13母棒</td><td>630</td><td>吨</td></tr>
        <tr><td>☐</td><td>DC53母棒</td><td>300</td><td>吨</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">手动输入 (物品不在目录时)</div>
    <div class="row">
      <div class="field"><div class="label">物品名称</div><div class="input"></div></div>
      <div class="field"><div class="label">类型</div><div class="select">钢种 <span style="color:#aaa;">▾</span></div></div>
    </div>
    <div class="row">
      <div class="field"><div class="label">规格</div><div class="input"></div></div>
      <div class="field"><div class="label">单位</div><div class="select">吨 <span style="color:#aaa;">▾</span></div></div>
    </div>
    <div style="text-align:right;"><span class="btn-inline">+ 加入列表</span></div>
  </div>

  <div class="section">
    <div class="section-title">已选出钢</div>
    <table>
      <thead><tr><th>#</th><th>物品</th><th>规格</th><th>归属</th><th>炉号(必填)</th><th>重(吨)</th><th>支</th><th>单价</th></tr></thead>
      <tbody>
        <tr>
          <td>1</td><td>H13母棒</td><td>630</td>
          <td><span class="sel-cell">本厂 ▾</span></td>
          <td><span class="inp-cell">3-60-63</span></td>
          <td><span class="inp-cell">7.311</span></td>
          <td><span class="inp-cell">16</span></td>
          <td><span class="inp-cell">____</span></td>
        </tr>
      </tbody>
    </table>
    <div class="row">
      <div class="field"><div class="label">出钢日期</div><div class="input">2025-03-19</div></div>
      <div class="field"><div class="total">合计: 7.311 吨 / 16 支</div></div>
    </div>
    <div class="hint">⚠️ 单价可选填, 留空则该行不计入费用汇总</div>
    <div class="hint">⚠️ 手动输入的新物品将自动加入物品表</div>
    <div style="margin-top:12px;"><div class="label">备注</div><div class="input"></div></div>
  </div>

  <div class="actions">
    <div class="btn btn-primary">确认添加</div>
    <div class="btn btn-cancel">取消</div>
  </div>
</div>
</body>
</html>
