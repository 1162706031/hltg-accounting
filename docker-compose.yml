services:
  backend:
    image: bd2cee1faebf
    platform: linux/amd64
    container_name: hltg-accounting-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_DEBUG: ${APP_DEBUG:-false}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-hltg_accounting}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

  frontend:
    image: e802e4a7f072
    platform: linux/amd64
    container_name: hltg-accounting-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
